name: CI Matrix

on: [push, pull_request]

jobs:
  Windows:
    name: Windows ${{ matrix.runs.generator }} (${{ matrix.build-type }})
    runs-on: ${{ matrix.runs.os }}
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        runs:
          # windows-2022 rather than -latest: crypto++ 8.9.0 uses
          # stdext::make_checked_array_iterator, removed from the MSVC STL in
          # VS 18. Return to windows-latest when a crypto++ release ships
          # https://github.com/weidai11/cryptopp/pull/1339.
          - {generator: "Ninja", os: windows-2022}
          - {generator: "NMake Makefiles", os: windows-2022}
          - {generator: "Visual Studio 17 2022", os: windows-2022}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.21.0"
          ninjaVersion: "1.11.0"

      - name: Setup ccache
        # If ccache behaves badly on windows, skip this step
        # if: runner.os != 'Windows'
        uses: Chocobo1/setup-ccache-action@v1
        with:
          install_ccache: true
          update_packager_index: true
          prepend_symlinks_to_path: true
          windows_compile_environment: msvc # this field is required

      - name: Set MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        run: |
          cmake `
            -S . `
            -B build `
            -D CMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -G "${{ matrix.runs.generator }}" `
            -D USE_CCACHE=ON `
            -D CMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }}

      - name: Run cryptest
        run: ctest --verbose -j40 -R cryptest --test-dir build -C ${{ matrix.build-type }}

      - name: Run build tests
        # disable-asm is excluded: CRYPTOPP_DISABLE_ASM with MSVC is broken in
        # crypto++ 8.9.0 (#101, weidai11/cryptopp#1240); re-include the test
        # when a crypto++ release with the fix lands here.
        run: ctest -j40 -E "cryptest|disable-asm" --output-on-failure --test-dir build -C ${{ matrix.build-type }}

  MacOS:
    name: ${{ matrix.config.name }} ${{matrix.generator }} (${{ matrix.build-type }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        generator: [Ninja, Xcode]
        config:
          - {
              name: "MacOS",
              omp: "OFF",
            }
          - {
              name: "MacOS-omp-homebrew",
              omp: "ON",
            }

          - {
              name: "MacOS-omp-macports",
              omp: "ON",
            }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          # CMake 3.21 cannot drive the Xcode versions present on current
          # runner images; the 3.21 floor stays covered by the Ninja jobs.
          cmakeVersion: "${{ matrix.generator == 'Xcode' && 'latest' || '~3.21.0' }}"
          ninjaVersion: "1.11.0"

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          install_ccache: true
          # Not needed to install ccache (a bottle), and a failing brew
          # update makes the action abort, silently skipping ccache.
          update_packager_index: false
          prepend_symlinks_to_path: false
          windows_compile_environment: msvc # this field is required

      - name: Install libomp (homebrew)
        run: |
          # The preinstalled aws/tap is untrusted and makes every brew call warn.
          if brew tap | grep -q "^aws/tap$"; then
            brew untap aws/tap
          fi
          brew install libomp
        if: endsWith(matrix.config.name, 'homebrew')

      - name: Install macports
        uses: melusina-org/setup-macports@v1
        if: endsWith(matrix.config.name, 'macports')

      - name: Install libomp (macports)
        run: |
          port install libomp
          # Homebrew's libomp would shadow the MacPorts one; drop it if present.
          if brew list libomp &>/dev/null; then
            brew uninstall --ignore-dependencies --zap libomp
          fi
        if: endsWith(matrix.config.name, 'macports')

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G ${{ matrix.generator }} \
            -D USE_CCACHE=ON \
            -D CMAKE_VERBOSE_MAKEFILE=ON \
            -D USE_OPENMP=${{ matrix.config.omp }} \
            -D CMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: |
          NINJA_STATUS="[%f/%t %o/sec] " export NINJA_STATUS
          cmake --build build --config ${{ matrix.build-type }}

      - name: Run cryptest
        run: ctest -j40 --verbose -R "cryptest" --test-dir build -C ${{ matrix.build-type }}

      - name: Run build tests
        run: ctest -j40 -E "cryptest"  --output-on-failure --test-dir build -C ${{ matrix.build-type }}

  Ubuntu:
    name: ${{ matrix.config.name }} (${{ matrix.build-type }})
    # The newest image that provides gcc-10 for the oldest-supported-compiler
    # configuration below.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        config:
          - {
              name: "ubuntu",
              cc: "gcc-10",
              cxx: "g++-10",
              generators: "Ninja",
            }
          - {
              name: "ubuntu-gcc12",
              cc: "gcc-12",
              cxx: "g++-12",
              generators: "Ninja",
            }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Print env
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.21.0"
          ninjaVersion: "1.11.0"

      - name: Install ccache
        shell: cmake -P {0}
        run: |
          set(ccache_version "4.6.3")
          set(ccache_dist "ccache-${ccache_version}-linux-x86_64")
          set(ccache_url "https://github.com/ccache/ccache/releases/download/v${ccache_version}/${ccache_dist}.tar.xz")
          file(DOWNLOAD "${ccache_url}" ./ccache.tar.xz SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar zxvf ./ccache.tar.xz)
          # Add to PATH environment variable
          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${ccache_dist}" ccache_dir)
          set(path_separator ":")
          file(APPEND "$ENV{GITHUB_PATH}" "$ENV{GITHUB_WORKSPACE}${path_separator}${ccache_dir}")

      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          install_ccache: false
          update_packager_index: false
          prepend_symlinks_to_path: false
          windows_compile_environment: msvc # this field is required

      - name: Configure
        run: |
          export CC=${{ matrix.config.cc }}
          export CXX=${{ matrix.config.cxx }}
          export PATH=${GITHUB_WORKSPACE}:${PATH}

          cmake \
            -S . \
            -B build \
            -D CMAKE_BUILD_TYPE=$ENV{BUILD_TYPE} \
            -G Ninja \
            -D CMAKE_MAKE_PROGRAM=ninja \
            -D USE_CCACHE=ON \
            -D CMAKE_VERBOSE_MAKEFILE=ON \
            -D CMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: |
          export NINJA_STATUS="[%f/%t %o/sec] "

          cmake --build build --target all --config ${{ matrix.build-type }}

      - name: Run cryptest
        run: ctest -j40 --verbose -R cryptest --test-dir build -C ${{ matrix.build-type }}

      - name: Run build tests
        run: |
          export CC=${{ matrix.config.cc }}
          export CXX=${{ matrix.config.cxx }}

          ctest -j40 -E cryptest --output-on-failure --test-dir build -C ${{ matrix.build-type }}

  MSys:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        # clang64 is not listed: linking fails with XGETBV64/CPUID64 unresolved
        # in crypto++ 8.9.0 (#103, weidai11/cryptopp#1241); re-add it when a
        # crypto++ release with the fix lands here.
        sys: [mingw32, mingw64, ucrt64]
        config:
          - {
              name: "with OMP ",
              omp: ON,
            }
          - {
              name: "",
              omp: "OFF",
            }
        exclude:
          - sys: mingw32
            build-type: Debug
    name: MSys - ${{ matrix.sys }} ${{ matrix.config.name }}(${{ matrix.build-type }})
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Setup ccache
      uses: Chocobo1/setup-ccache-action@v1
      with:
        prepend_symlinks_to_path: false
        windows_compile_environment: msys2
    - name: Configure
      run: |
        cmake -G"Unix Makefiles" \
          -S . \
          -B build \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DUSE_OPENMP=${{ matrix.config.omp }} \
          -D USE_CCACHE=ON
    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }}
    - name: Run cryptest
      run:  ctest -j40 --verbose -R cryptest --test-dir build -C ${{ matrix.build-type }}
    - name: Run tests
      run: ctest -j40 -E cryptest --output-on-failure --test-dir build -C ${{ matrix.build-type }}

  cygwin:
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release]
        config:
          - {
              name: "with OMP ",
              omp: ON,
            }
          - {
              name: "",
              omp: "OFF",
            }
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
    name: Cygwin  ${{ matrix.config.name }}(${{ matrix.build-type }})
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: >-
          ccache
          cmake
          gcc-core
          gcc-g++
          ninja
    - name: Configure
      run: |
        cmake /cygdrive/d/a/cryptopp-cmake/cryptopp-cmake \
          -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DUSE_OPENMP=${{ matrix.config.omp }} \
          -D USE_CCACHE=ON
    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }}
    - name: Run cryptest
      run:  ctest -j40 --verbose -R cryptest --test-dir build -C ${{ matrix.build-type }}
    - name: Run tests
      run: ctest -j40 -E cryptest --output-on-failure --test-dir build -C ${{ matrix.build-type }}
